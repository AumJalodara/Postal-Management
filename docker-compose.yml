version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_postal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_postal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_postal_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APPLICATION_ENV: production
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/smart_postal_db
      HOST: "0.0.0.0"
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-super-secure-production-random-jwt-key-min32chars}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - postal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_postal_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - postal_net

volumes:
  postgres_data:

networks:
  postal_net:
    driver: bridge
